name: Lint and Test Charts

on:
  pull_request:
    paths:
      - "charts/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            echo "Linting $chart..."
            helm lint "$chart"
          done

      - name: Template charts
        run: |
          helm template test-agent charts/autokube-agent \
            --set url=http://test:5173 \
            --set token=test_token > /dev/null

          helm template test-dashboard charts/autokube > /dev/null
