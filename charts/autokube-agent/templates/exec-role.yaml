{{- if and .Values.rbac.create .Values.rbac.namespaceExec.create }}
{{- range $namespace := .Values.rbac.namespaceExec.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "autokube-agent.fullname" $ }}-pod-exec
  namespace: {{ $namespace }}
  labels:
    {{- include "autokube-agent.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources:
      - pods/exec
      - pods/attach
      - pods/portforward
    verbs: ["create", "get"]
{{- end }}
{{- end }}
