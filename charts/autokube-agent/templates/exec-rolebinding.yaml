{{- if and .Values.rbac.create .Values.rbac.namespaceExec.create }}
{{- range $namespace := .Values.rbac.namespaceExec.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "autokube-agent.fullname" $ }}-pod-exec
  namespace: {{ $namespace }}
  labels:
    {{- include "autokube-agent.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "autokube-agent.fullname" $ }}-pod-exec
subjects:
  - kind: ServiceAccount
    name: {{ include "autokube-agent.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
