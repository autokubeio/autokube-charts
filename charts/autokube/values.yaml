# AutoKube Dashboard Helm Values

image:
  repository: autokubeio/autokube
  tag: "1.3.0"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: autokube.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  name: autokube
  annotations: {}

persistence:
  enabled: false
  storageClass: ""
  volumeSize: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
imagePullSecrets: []
